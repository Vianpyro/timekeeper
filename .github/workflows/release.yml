name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches gradle.properties version
        run: .github/scripts/release-verify-version.sh "${GITHUB_REF_NAME}"

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: ./gradlew build

      - name: Locate build artifact
        id: artifact
        run: |
          JAR="$(find build/libs -maxdepth 1 -name 'timekeeper-*.jar' ! -name '*-sources.jar' | head -n1)"
          if [[ -z "$JAR" ]]; then
            echo "::error::No jar found in build/libs matching timekeeper-*.jar (excluding sources)."
            exit 1
          fi
          echo "Found jar: $JAR"
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: .github/scripts/release-generate-notes.sh "${GITHUB_REF_NAME}"

      # Draft first, attach the jar, then only publish to Modrinth once the draft exists - if
      # Modrinth publishing fails below, the release is left safely in draft rather than live
      # with no matching Modrinth listing.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${{ steps.artifact.outputs.jar_path }}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1 (renamed from Kir-Antipov/mc-publish)
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.artifact.outputs.jar_path }}
          name: Timekeeper ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          version-type: release
          changelog-file: RELEASE_NOTES.md
          loaders: fabric
          game-versions: |
            26.2
          java: |
            25

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
