name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  decide-or-tag:
    name: Decide next release or tag an approved one
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # A push to main is either a normal merge (propose/update the release PR) or the merge of
      # the release PR itself (tag it, which triggers release.yml). GitHub's default squash
      # message appends " (#123)" to the PR title, hence the optional suffix below.
      - name: Detect release-PR merge
        id: detect
        run: |
          SUBJECT="$(git log -1 --format=%s)"
          echo "Last commit subject: $SUBJECT"
          if [[ "$SUBJECT" =~ ^chore\(release\):\ publish\ (v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]]+\(#[0-9]+\))?$ ]]; then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag release
        if: steps.detect.outputs.is_release_merge == 'true'
        run: .github/scripts/cd-tag-release.sh "${{ steps.detect.outputs.version_tag }}"

      - name: Propose release
        if: steps.detect.outputs.is_release_merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cd-propose-release.sh
