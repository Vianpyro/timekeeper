# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Loom does not yet fully support Gradle's configuration cache.
org.gradle.configuration-cache=false

# Minecraft / Fabric versions - check for updates at https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.157.0+26.2

# Mod properties
# This "version" key is the single source of truth for the project version: cd.yml bumps it
# on every release proposal, and release.yml checks it against the pushed Git tag before
# publishing. Keep the key name and format (plain X.Y.Z, no leading "v") stable, since
# .github/scripts/*.sh parse it with a plain regex.
version=0.2.0
group=io.github.vianpyro
